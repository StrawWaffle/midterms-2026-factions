name: Update data

on:
  schedule:
    - cron: "0 7 * * *"   # daily, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed CSVs
  actions: write    # start the deploy workflow (pushes made with GITHUB_TOKEN do not trigger it)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep downloads between runs so unchanged FEC bulk files are not fetched again (conditional GET).
      - uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Rebuild CSVs
        id: build
        run: python -I pipeline/update.py

      # Runs even if a source failed: rows from failed sources keep their published values.
      - name: Commit and push changes
        id: commit
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "StrawWaffle"
          git config user.email "355859478+StrawWaffle@users.noreply.github.com"
          git add public/data
          git commit -m "Update election data $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the site
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
